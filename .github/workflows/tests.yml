name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check core browser modules
        run: |
          node --check data.js
          node --check receipt.js
          node --check receipt-barcode.js
          node --check returns-data.js
          node --check returns.js
          node --check returns-tile.js
          node --check return-lookup-data.js
          node --check quick-return.js
          node --check quick-return-tile.js
          node --check return-document-data.js
          node --check return-document.js
          node --check purchase-reversal-data.js
          node --check purchase-reversal.js
          node --check purchase-returns-data.js
          node --check purchase-returns.js
          node --check purchase-returns-tile.js
          node --check purchase-payment-data.js
          node --check purchase-payment.js
          node --check supplier-payables-data.js
          node --check supplier-payables.js
          node --check supplier-activity-data.js
          node --check supplier.js
          node --check statement.js
          node --check cash.js
          node --check daily.js
          node --check cash-statement-math.js
      - name: Run Node tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 3

<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>کاشێر — بازسازی سیستەم</title>
  <style>
:root {
  --ui-font: Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  --ui-bg: #f3f6fb;
  --ui-surface: #ffffff;
  --ui-soft: #edf3fc;
  --ui-ink: #20334e;
  --ui-muted: #586d87;
  --ui-border: #d5dfed;
  --ui-primary: #195fc4;
  --ui-primary-hover: #124dA4;
  --ui-danger: #b42336;
  --ui-success: #18714b;
  --ui-warning: #87540e;
  --ui-radius: 10px;
  --ui-card-radius: 16px;
  --ui-shadow: 0 4px 18px #18385e08;
  --ui-gap: 16px;
  --ui-page-space: 24px;
  --ui-control-height: 44px;
}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:var(--ui-page-space);background:var(--ui-bg);color:var(--ui-ink);font:14px/1.9 var(--ui-font)}main{width:100%;max-width:580px;padding:32px;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-card-radius);box-shadow:var(--ui-shadow)}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.mark{display:grid;place-items:center;background:var(--ui-primary);color:white;width:36px;height:36px;border-radius:var(--ui-radius);font:700 22px/1 Arial,sans-serif;direction:ltr}.badge{display:inline-block;margin-top:24px;padding:6px 12px;border-radius:var(--ui-radius);background:var(--ui-soft);color:var(--ui-primary);font-size:13px}h1{font-size:24px;line-height:1.65;margin:16px 0}p{color:var(--ui-muted);font-size:14px;margin:12px 0}.note{margin-top:24px;padding-top:16px;border-top:1px solid var(--ui-border);font-size:13px}@media(max-width:480px){body{padding:16px}main{padding:24px}h1{font-size:22px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">K</span><span>کاشێر</span></div>
    <span class="badge">لە بازسازیدایە</span>
    <h1>چوونەژوورەوە و دەسەڵاتەکان لە نوێوە دادەڕێژرێنەوە</h1>
    <p>پەڕەکانی پێشوو ناچالاک کراون. سیستەم دوای پەسەندکردنی دیزاینی نوێ دەخرێتەوە کار.</p>
    <p class="note">داتای کاروبار پارێزراوە. لەم پەڕەیە هیچ مامەڵەیەک تۆمار ناکرێت.</p>
  </main>
</body>
</html>

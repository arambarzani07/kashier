<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>کاشێر — بازسازی سیستەم</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f5fa;color:#21324a;font-family:Tahoma,Arial,sans-serif;line-height:2}main{width:100%;max-width:580px;padding:40px;background:#fff;border:1px solid #dce4ef;border-radius:20px;box-shadow:0 18px 60px #1435610c}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold}.mark{display:grid;place-items:center;background:#1762c8;color:white;width:48px;height:48px;border-radius:14px;direction:ltr}.badge{display:inline-block;margin-top:32px;padding:4px 12px;border-radius:30px;background:#edf3fc;color:#1758aa;font-size:13px}h1{font-size:28px;line-height:1.7;margin:16px 0}p{color:#5b6e87;font-size:15px;margin:12px 0}.note{margin-top:28px;padding-top:20px;border-top:1px solid #e5ebf3;font-size:13px}@media(max-width:480px){body{padding:16px}main{padding:28px 22px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">K</span><span>کاشێر</span></div>
    <span class="badge">لە بازسازیدایە</span>
    <h1>چوونەژوورەوە و دەسەڵاتەکان لە نوێوە دادەڕێژرێنەوە</h1>
    <p>پەڕەکانی پێشوو ناچالاک کراون. سیستەم دوای پەسەندکردنی دیزاینی نوێ دەخرێتەوە کار.</p>
    <p class="note">داتای کاروبار پارێزراوە. لەم پەڕەیە هیچ مامەڵەیەک تۆمار ناکرێت.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاشێر — کشفی حسابی دابینکەر</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="statement.css"><script src="config.js" defer></script><script src="data.js" defer></script><script src="statement.js" defer></script></head>
<body class="statement-page" data-account-kind="supplier"><header class="topbar"><div class="brand"><span class="brand-mark">K</span><strong>کاشێر</strong></div><span>کشفی حسابی دابینکەر</span><a id="back-customer" href="suppliers.html">گەڕانەوە بۆ دابینکەرەکان ←</a></header>
<main class="statement-layout"><section class="statement-controls" aria-label="هەڵبژاردنی ماوە"><h1>کشفی حسابی دابینکەر</h1><form id="statement-form"><div><label for="statement-from">لە بەرواری</label><input id="statement-from" type="date" min="0001-01-01" max="9999-12-31"></div><div><label for="statement-to">تا بەرواری</label><input id="statement-to" type="date" min="0001-01-01" max="9999-12-31"></div><button id="statement-load" type="submit">پیشاندان / نوێکردنەوە</button><button id="statement-all" type="button" class="secondary">هەموو ماوەکان</button></form><p>بەروارەکان بە کاتی بەغدا و هەردوو ڕۆژی سەرەتا و کۆتایی لەخۆ دەگرن. خانەی بەتال سنوور دانانێت.</p><button id="statement-print" class="secondary" disabled>چاپکردنی کشفی حساب</button><p id="statement-status" role="status" aria-live="polite"></p></section>
<article id="statement-paper" class="statement-paper" aria-label="کشفی حساب" hidden></article></main></body></html>

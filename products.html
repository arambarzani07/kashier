<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاشێر — لیستی کاڵاکان</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="sale.css"><link rel="stylesheet" href="catalog.css"><script src="config.js" defer></script><script src="data.js" defer></script><script src="sale-math.js" defer></script><script src="products.js" defer></script></head><body class="sale-page"><header class="topbar"><div class="brand"><span class="brand-mark">K</span><strong>کاشێر</strong></div><span>لیستی کاڵاکان</span><div class="header-links"><a class="home-link" href="stock.html">کۆگا</a><a class="home-link" href="purchase.html">کڕین</a><a class="home-link" href="sale.html">کاڵا فرۆشتن</a><a class="home-link" href="index.html">سەرەکی ←</a><button id="logout" class="logout">دەرچوون</button></div></header><main class="catalog-layout"><section class="cart-panel"><div class="section-heading"><div><span class="eyebrow">کاتالۆگی کاڵا</span><h1>لیستی کاڵاکان</h1></div><button id="new-product" class="primary">＋ ناساندنی کاڵای نوێ</button></div><form id="product-search" class="scan-form"><label for="query">گەڕان بە ناو یان بارکۆد</label><div><input id="query" type="search" maxlength="100" autocomplete="off"><button type="submit">گەڕان</button><button id="reset-search" type="button">هەموو</button></div></form><p id="catalog-status" role="status" class="inline-status"></p><div class="table-wrap"><table><caption class="sr-only">کاڵا تۆمارکراوەکان</caption><thead><tr><th scope="col">ناوی کاڵا</th><th scope="col">بارکۆد</th><th scope="col">نرخی فرۆشتن / دینار</th><th scope="col">کردار</th></tr></thead><tbody id="products"></tbody></table></div><div class="catalog-pagination"><button id="previous" class="secondary">پێشوو</button><span id="product-count"></span><button id="next" class="secondary">داهاتوو</button></div></section></main><dialog id="product-dialog" aria-labelledby="product-title"><div class="dialog-heading"><h2 id="product-title">ناساندنی کاڵای نوێ</h2><button id="close-product" aria-label="داخستن">×</button></div><form id="product-form"><label for="product-name">ناوی کاڵا</label><input id="product-name" required maxlength="150"><label for="product-barcode">بارکۆد <span class="optional">(ئارەزوومەندانە)</span></label><input id="product-barcode" maxlength="64" dir="ltr"><label for="product-price">نرخی فرۆشتن / دینار</label><input id="product-price" type="number" required min="1" max="1000000000" step="1" inputmode="numeric"><p id="product-error" role="status" class="field-error"></p><button id="save-product" class="primary" type="submit">تۆمارکردنی کاڵا</button></form></dialog></body></html>
